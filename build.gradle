plugins {
	id 'eclipse'
	id 'idea'
	id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
	id 'maven-publish'
}

base {
	archivesName = project.mod_id
}
if (env.RELEASE) {
    version = mod_version

} else {
    version = "$mod_version-SNAPSHOT"
}
group = project.maven_group

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			programArguments.addAll '--username', 'Dev###'
		}

		server {
			server()
			programArgument '--nogui'
		}

		configureEach {
			logLevel = org.slf4j.event.Level.WARN
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
    maven {
        url = 'https://maven.gegy.dev/releases'
        content {
            includeGroup 'org.lovetropics'
            includeGroup 'eu.pb4'
        }
    }
	mavenLocal()
}

dependencies {
	jarJar(implementation("org.lovetropics:LTLib:$ltlib_version"))
	jarJar(implementation("eu.pb4:placeholder-api-lt:$placeholder_api_version"))
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
			mod_id: mod_id,
			mod_version: mod_version,
	]
	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        if (env.MAVEN_URL) {
            maven {
                credentials {
                    username env.MAVEN_USERNAME
                    password env.MAVEN_PASSWORD
                }
                url env.MAVEN_URL
            }
        } else {
            mavenLocal()
        }
    }
}